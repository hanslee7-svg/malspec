<meta name="description" content="MAL4SAP — 매일 아침 SAP를 자동 점검하는 서비스. FI·SD·MM·CO 일일점검 + 시스템 진단 데모 (모의 데이터)">

<style>
:root{
  --sapblue:#0a6ed1; --sapdark:#354a5f; --sapdarker:#29394a;
  --ink:#16211c; --paper:#f7f5ef; --card:#ffffff;
  --rule:#d9d4c7; --mut:#6b7268;
  --warn:#b3421f; --warn-bg:#fbeee8;
  --info:#8a6d1f; --info-bg:#faf3df;
  --ok:#2e6b4f;  --ok-bg:#eaf2ec;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif;
  font-size:14px;line-height:1.5;color:var(--ink);background:var(--paper)}

/* ── 로그인 (SAP 로그온 스타일) ─────────────────────── */
#login{position:fixed;inset:0;display:flex;align-items:center;
  justify-content:center;background:linear-gradient(160deg,var(--sapdark),var(--sapdarker));z-index:10}
.logon{width:380px;background:#fff;border-radius:4px;overflow:hidden;
  box-shadow:0 18px 50px rgba(0,0,0,.4)}
.logon .top{background:var(--sapdark);color:#fff;padding:18px 24px}
.logon .top .sys{font-size:11px;letter-spacing:.18em;opacity:.75;text-transform:uppercase}
.logon .top h1{font-size:19px;font-weight:700;margin-top:2px}
.logon .body{padding:22px 24px 26px}
.fld{margin-bottom:13px}
.fld label{display:block;font-size:12px;color:#556;margin-bottom:4px}
.fld input,.fld select{width:100%;font:inherit;padding:8px 10px;
  border:1px solid #bcc3cc;border-radius:3px;background:#fbfcfd}
.fld input:focus,.fld select:focus{outline:2px solid var(--sapblue);border-color:var(--sapblue)}
.logon .btn-logon{width:100%;margin-top:6px;font:inherit;font-weight:700;
  background:var(--sapblue);color:#fff;border:none;border-radius:3px;
  padding:10px;cursor:pointer;font-size:14px}
.logon .btn-logon:hover{background:#085caf}
.logon .note{margin-top:14px;font-size:11.5px;color:#889;line-height:1.5}
.logon .err{display:none;color:var(--warn);font-size:12px;margin-top:8px}

/* ── 앱 셸 ──────────────────────────────────────────── */
#app{display:none}
.topbar{background:var(--sapdark);color:#fff;padding:0 20px;
  display:flex;align-items:center;justify-content:space-between;height:48px}
.topbar .brand{font-size:13px;font-weight:700;letter-spacing:.1em}
.topbar .brand span{opacity:.6;font-weight:400;margin-left:10px;letter-spacing:0}
.topbar .right{display:flex;align-items:center;gap:14px;font-size:12px}
.topbar .conn{opacity:.8}
.btn-run{font:inherit;font-size:12px;font-weight:700;color:#fff;
  background:var(--sapblue);border:none;border-radius:3px;
  padding:6px 14px;cursor:pointer}
.btn-run:hover{background:#085caf}
.btn-out{font:inherit;font-size:12px;color:#fff;background:none;
  border:1px solid rgba(255,255,255,.4);border-radius:3px;
  padding:5px 12px;cursor:pointer}
.tabs{background:#fff;border-bottom:1px solid var(--rule);
  display:flex;padding:0 20px;gap:2px;overflow-x:auto}
.tab{font:inherit;font-size:13.5px;font-weight:600;color:var(--mut);
  background:none;border:none;border-bottom:3px solid transparent;
  padding:12px 18px 10px;cursor:pointer;white-space:nowrap;
  display:flex;align-items:center;gap:7px}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--sapblue);border-bottom-color:var(--sapblue)}
.tab .badge{font-size:10.5px;font-weight:800;color:#fff;background:var(--warn);
  border-radius:9px;padding:1px 7px;min-width:18px;text-align:center}
.tab .badge.zero{background:var(--ok)}
.tab.soon{color:#b8bcb4;cursor:default}
.tab.soon:hover{color:#b8bcb4}

/* ── 리포트 영역 (기존 스타일 계승) ─────────────────── */
.page{max-width:920px;margin:0 auto;padding:26px 16px 48px}
.rhead{display:flex;justify-content:space-between;align-items:flex-end;
  border-bottom:3px solid var(--ink);padding-bottom:10px;flex-wrap:wrap;gap:6px}
.rhead h2{font-size:21px;font-weight:800}
.rhead .meta{color:var(--mut);font-size:12.5px}
.summary{display:flex;border-bottom:1px solid var(--rule);margin-bottom:18px}
.summary div{flex:1;padding:10px 4px;text-align:center;border-right:1px solid var(--rule)}
.summary div:last-child{border-right:none}
.summary b{display:block;font-size:24px;font-variant-numeric:tabular-nums;font-weight:800}
.summary span{font-size:11px;color:var(--mut);letter-spacing:.08em}
.n-warn b{color:var(--warn)} .n-info b{color:var(--info)} .n-ok b{color:var(--ok)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--card);border:1px solid var(--rule);border-top:4px solid;
  border-radius:2px;padding:12px 14px;display:flex;flex-direction:column}
.card.WARN{border-top-color:var(--warn)}
.card.INFO{border-top-color:var(--info)}
.card.OK{border-top-color:var(--ok)}
.card .row1{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card h3{font-size:13.5px;font-weight:700}
.tag{font-size:10.5px;font-weight:700;padding:1px 8px;border-radius:2px;
  letter-spacing:.1em;white-space:nowrap}
.WARN .tag{color:var(--warn);background:var(--warn-bg)}
.INFO .tag{color:var(--info);background:var(--info-bg)}
.OK .tag{color:var(--ok);background:var(--ok-bg)}
.card .head{font-size:14.5px;margin-top:4px;font-weight:600;
  font-variant-numeric:tabular-nums}
.card ul{margin-top:6px;list-style:none;flex:1}
.card li{padding:2px 0;font-size:12.5px;color:#3c443e;
  font-variant-numeric:tabular-nums}
.card li::before{content:"—";color:var(--mut);margin-right:6px}
.btn{margin-top:10px;align-self:flex-start;font:inherit;font-size:12px;
  font-weight:700;color:var(--ink);background:none;
  border:1px solid var(--ink);border-radius:2px;padding:4px 14px;cursor:pointer}
.btn:hover{background:var(--ink);color:var(--card)}
.drill{display:none;margin-top:10px;border-top:1px dashed var(--rule);
  padding-top:8px;overflow-x:auto}
.drill.open{display:block}
.drill table{width:100%;border-collapse:collapse;font-size:12px;
  font-variant-numeric:tabular-nums}
.drill th{text-align:left;color:var(--mut);font-weight:600;
  border-bottom:1px solid var(--rule);padding:3px 8px 3px 0;white-space:nowrap}
.drill td{border-bottom:1px solid #eeeae0;padding:3px 8px 3px 0;white-space:nowrap}
.drill tr:last-child td{border-bottom:none}
.pfoot{margin-top:26px;padding-top:10px;border-top:1px solid var(--rule);
  color:var(--mut);font-size:11.5px;display:flex;justify-content:space-between;gap:8px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:var(--sapdark);color:#fff;padding:9px 20px;border-radius:4px;
  font-size:12.5px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:20}
.toast.show{opacity:1}
@media(max-width:640px){.grid{grid-template-columns:1fr}}
</style></head>

function switchMode(){
  const m = document.getElementById('f-mode').value;
  document.getElementById('grp-demo').style.display  = m==='demo'  ? '' : 'none';
  document.getElementById('grp-rfc').style.display   = m==='rfc'   ? '' : 'none';
  document.getElementById('grp-odata').style.display = m==='odata' ? '' : 'none';
  document.getElementById('fld-client').style.display = m==='odata' ? 'none' : '';
  document.getElementById('lbl-user').textContent = m==='odata' ? '통신 사용자' : '사용자';
  document.getElementById('logon-note').innerHTML = MODE_NOTE[m];
}

function doLogon(){
  const m = document.getElementById('f-mode').value;
  const user = document.getElementById('f-user').value.trim();
  const pw = document.getElementById('f-pw').value;
  const err = document.getElementById('logon-err');
  let connLabel = '';
  if(m==='demo'){
    const client = document.getElementById('f-client').value.trim();
    if(!client || !user || !pw){ err.style.display='block'; return; }
    connLabel = document.getElementById('f-sys').value.split(' ')[0]
      + ' · CL' + client + ' · ' + user.toUpperCase() + ' · 데모';
  } else if(m==='rfc'){
    const host = document.getElementById('f-ashost').value.trim();
    const client = document.getElementById('f-client').value.trim();
    if(!host || !client || !user || !pw){ err.style.display='block'; return; }
    connLabel = host + ' · CL' + client + ' · ' + user.toUpperCase() + ' · RFC';
  } else {
    const url = document.getElementById('f-apiurl').value.trim();
    if(!url || !user || !pw){ err.style.display='block'; return; }
    connLabel = url.replace('https://','').split('.')[0]
      + ' · ' + user.toUpperCase() + ' · OData';
  }
  // 프로토타입: 모든 모드에서 저장된 점검 결과 표시.
  // 실전: 모드별 백엔드 인증(pyrfc 접속 테스트 / OData $top=1 프로브) 후 진입
  session = {mode: m, conn: connLabel};
  document.getElementById('conn-info').textContent = connLabel;
  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='block';
  if(m!=='demo'){
    setTimeout(()=>{
      const t=document.getElementById('toast');
      t.textContent='프로토타입: 실제 접속 대신 저장된 점검 결과를 표시합니다. '
        +'(실전: '+(m==='rfc'?'RFC 접속 후 추출':'표준 API 추출')+' → 점검 → 표시)';
      t.classList.add('show');
      setTimeout(()=>t.classList.remove('show'), 3800);
    }, 400);
  }
  buildTabs();
}

function logoff(){ location.reload(); }

function buildTabs(){
  const bar = document.getElementById('tabs');
  bar.innerHTML='';
  Object.entries(DATA.modules).forEach(([key,m],i)=>{
    const sc = m.results.find(r=>r.id==='DG_SCORE');
    const warn = m.results.filter(r=>r.severity==='WARN').length;
    const b = document.createElement('button');
    b.className='tab'+(i===0?' active':'');
    const badge = sc ? sc.metric+'점' : warn;
    b.innerHTML = m.label +
      '<span class="badge'+((sc?sc.metric<60:warn)?'':' zero')+'">'+badge+'</span>';
    b.onclick = ()=>{ document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
                      b.classList.add('active'); renderModule(key); };
    bar.appendChild(b);
  });
  ['PP 일일점검','자금 일일점검'].forEach(nm=>{
    const b=document.createElement('button');
    b.className='tab soon'; b.textContent=nm+' (예정)'; bar.appendChild(b);
  });
  renderModule(Object.keys(DATA.modules)[0]);
}

  let res = [...m.results];
  const scoreItem = res.find(r=>r.id==='DG_SCORE');
  if(scoreItem) res = res.filter(r=>r.id!=='DG_SCORE');
  res.sort((a,b)=>SEV_ORDER[a.severity]-SEV_ORDER[b.severity]);
  const cnt = s => res.filter(r=>r.severity===s).length;
  let cards='';
  res.forEach((r,i)=>{
    let detail='';
    if(r.detail && r.detail.length)
      detail='<ul>'+r.detail.slice(0,3).map(d=>'<li>'+d+'</li>').join('')+'</ul>';
    let drill='';
    if(r.drill){
      const id='d-'+key+'-'+i;
      drill='<button class="btn" onclick="toggleDrill(\''+id+'\',this)">상세내역</button>'
        +'<div class="drill" id="'+id+'"><table><thead><tr>'
        +r.drill.cols.map(c=>'<th>'+c+'</th>').join('')
        +'</tr></thead><tbody>'
        +r.drill.rows.map(row=>'<tr>'+row.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')
        +'</tbody></table></div>';
    }
    cards+='<div class="card '+r.severity+'"><div class="row1"><h3>'+r.title
      +'</h3><span class="tag">'+SEV_LABEL[r.severity]+'</span></div>'
      +'<div class="head">'+r.headline+'</div>'+detail+drill+'</div>';
  });
  let scoreBanner = '';
  if(scoreItem){
    const sc = scoreItem.metric;
    const col = sc>=80 ? 'var(--ok)' : sc>=60 ? 'var(--info)' : 'var(--warn)';
    scoreBanner =
      '<div style="display:flex;align-items:center;gap:22px;background:var(--card);'
      +'border:1px solid var(--rule);border-left:8px solid '+col+';'
      +'padding:16px 22px;margin-bottom:14px">'
      +'<div style="font-size:44px;font-weight:800;color:'+col
      +';font-variant-numeric:tabular-nums;line-height:1">'+sc+'<span '
      +'style="font-size:15px;color:var(--mut);font-weight:600"> /100</span></div>'
      +'<div><div style="font-size:16px;font-weight:700">'+scoreItem.headline+'</div>'
      +'<div style="font-size:12.5px;color:var(--mut);margin-top:3px">'
      +scoreItem.detail.join(' · ')+'</div></div></div>';
  }
  document.getElementById('page').innerHTML =
    scoreBanner
    +'<div class="rhead"><h2>'+m.label+' 보고</h2>'
    +'<div class="meta">점검 대상: '+m.target+' · 발행: '+DATA.generated_at
    +' · '+m.scope+'</div></div>'
    +'<div class="summary">'
    +'<div class="n-warn"><b>'+cnt('WARN')+'</b><span>주의 필요</span></div>'
    +'<div class="n-info"><b>'+cnt('INFO')+'</b><span>참고</span></div>'
    +'<div class="n-ok"><b>'+cnt('OK')+'</b><span>정상</span></div></div>'
    +'<div class="grid">'+cards+'</div>'
    +'<div class="pfoot"><span>기준선: 직전 30영업일 이동평균</span>'
    +'<span>MAL4SAP by NOAHLABS (prototype)</span></div>';
}

function toggleDrill(id, btn){
  const el=document.getElementById(id);
  const open=el.classList.toggle('open');
  btn.textContent = open ? '상세내역 닫기' : '상세내역';
}

function runNow(){
  // 데모: 임베드 데이터 재렌더 + 토스트. 실전: POST /api/run → 폴링 → 갱신
  const t=document.getElementById('toast');
  t.textContent='점검 실행 요청 — 데모 모드에서는 저장된 결과를 다시 표시합니다. '
    +'(실전: 서버가 SAP 접속 후 전 모듈 재점검)';
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 3200);
  const active=document.querySelector('.tab.active');
  if(active) active.click();
}
</script>
</body></html>
