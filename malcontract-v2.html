<html lang="ko">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>말계약 v2 — 전자 서명 계약</title>

<style>
:root {
  --primary: #E67E22;
  --primary-dark: #D35400;
  --primary-light: #FDF3E7;
  --secondary: #2C3E50;
  --bg: #F8F9FA;
  --bg-white: #FFFFFF;
  --border: #E1E6EB;
  --text: #1A1F26;
  --text-sub: #647079;
  --success: #27AE60;
  --warning: #F39C12;
  --error: #C0392B;
  --radius: 8px;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
  --shadow: 0 2px 8px rgba(0,0,0,0.06);
  --shadow-lg: 0 4px 16px rgba(0,0,0,0.08);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

button { font-family: inherit; cursor: pointer; }
input, textarea, select { font-family: inherit; font-size: inherit; }
textarea { resize: vertical; }

/* Layout */
.app { min-height: 100vh; display: flex; flex-direction: column; }

.header {
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
  color: white;
  padding: 14px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: 0 2px 8px rgba(230,126,34,0.2);
}

.logo {
  display: flex; align-items: center; gap: 10px;
  font-weight: 700; font-size: 18px;
}

.logo-badge {
  background: rgba(255,255,255,0.25);
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.05em;
}

.header-actions { display: flex; gap: 8px; }

.header-btn {
  background: rgba(255,255,255,0.2);
  color: white;
  border: none;
  padding: 7px 14px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 600;
  transition: background 0.15s;
}

.header-btn:hover { background: rgba(255,255,255,0.3); }

.main {
  flex: 1;
  padding: 24px;
  max-width: 1200px;
  width: 100%;
  margin: 0 auto;
}

/* Card */
.card {
  background: white;
  border-radius: 12px;
  padding: 24px;
  box-shadow: var(--shadow-sm);
  margin-bottom: 16px;
}

.card-title {
  font-size: 17px;
  font-weight: 700;
  margin-bottom: 6px;
  display: flex; align-items: center; gap: 8px;
}

.card-desc {
  font-size: 13px;
  color: var(--text-sub);
  margin-bottom: 20px;
}

/* Buttons */
.btn-primary {
  background: var(--primary);
  color: white;
  border: none;
  padding: 10px 20px;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
  transition: background 0.15s;
  display: inline-flex; align-items: center; gap: 6px;
}

.btn-primary:hover { background: var(--primary-dark); }
.btn-primary:disabled { background: #BFCCD6; cursor: not-allowed; }

.btn-ghost {
  background: transparent;
  color: var(--text-sub);
  border: 1px solid var(--border);
  padding: 8px 14px;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 500;
}

.btn-ghost:hover { color: var(--primary); border-color: var(--primary); background: var(--primary-light); }

.btn-danger {
  background: var(--error);
  color: white;
  border: none;
  padding: 8px 14px;
  border-radius: 6px;
  font-size: 12px;
}

/* Form */
.field-input, .field-textarea, .field-select {
  width: 100%;
  padding: 9px 12px;
  border: 1px solid var(--border);
  border-radius: 6px;
  font-size: 13px;
  color: var(--text);
}

.field-input:focus, .field-textarea:focus, .field-select:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(230,126,34,0.1);
}

.field-label {
  font-size: 12px; font-weight: 600;
  margin-bottom: 6px; display: block;
}

.field-required { color: var(--error); }

.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
.form-row.col-1 { grid-template-columns: 1fr; }

/* Upload */
.upload-box {
  border: 2px dashed var(--border);
  border-radius: 12px;
  padding: 40px 20px;
  text-align: center;
  cursor: pointer;
  background: var(--bg);
  transition: all 0.15s;
}

.upload-box:hover, .upload-box.dragover {
  border-color: var(--primary);
  background: var(--primary-light);
}

.upload-icon { font-size: 40px; margin-bottom: 10px; }
.upload-title { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
.upload-hint { font-size: 12px; color: var(--text-sub); }

/* Document preview */
.doc-container {
  background: white;
  border: 1px solid var(--border);
  border-radius: 8px;
  position: relative;
  overflow: hidden;
  min-height: 400px;
}

.doc-content {
  padding: 40px 60px;
  min-height: 800px;
  position: relative;
  font-size: 13px;
  line-height: 1.8;
  color: #1A1F26;
}

.doc-content h1, .doc-content h2, .doc-content h3 {
  margin: 1em 0 0.5em;
  font-weight: 700;
}
.doc-content h1 { font-size: 22px; }
.doc-content h2 { font-size: 18px; }
.doc-content h3 { font-size: 15px; }
.doc-content p { margin: 0.7em 0; }
.doc-content ul, .doc-content ol { padding-left: 24px; margin: 0.7em 0; }
.doc-content table { border-collapse: collapse; width: 100%; margin: 1em 0; }
.doc-content th, .doc-content td { border: 1px solid #999; padding: 6px 10px; }
.doc-content th { background: #F0F4F7; font-weight: 700; }

/* Field overlay */
.field-overlay {
  position: absolute;
  border: 2px dashed var(--primary);
  background: rgba(230,126,34,0.1);
  border-radius: 6px;
  cursor: move;
  padding: 6px 10px;
  font-size: 11px;
  font-weight: 600;
  color: var(--primary-dark);
  min-width: 100px;
  min-height: 30px;
  display: flex; align-items: center; justify-content: center;
  user-select: none;
}

.field-overlay.signature { min-width: 140px; min-height: 50px; }
.field-overlay:hover { background: rgba(230,126,34,0.2); }
.field-overlay.selected { border-style: solid; box-shadow: 0 0 0 3px rgba(230,126,34,0.3); }

.field-remove {
  position: absolute;
  top: -8px; right: -8px;
  width: 20px; height: 20px;
  border-radius: 50%;
  background: var(--error);
  color: white;
  border: none;
  font-size: 12px;
  display: none;
}

.field-overlay:hover .field-remove,
.field-overlay.selected .field-remove {
  display: flex; align-items: center; justify-content: center;
}

.field-overlay.filled {
  border-style: solid;
  background: rgba(39,174,96,0.1);
  border-color: var(--success);
  color: var(--success);
}

.field-overlay.signature.filled img {
  max-width: 100%; max-height: 100%; object-fit: contain;
}

/* Field toolbar */
.field-toolbar {
  display: flex; gap: 8px; margin-bottom: 12px;
  padding: 12px; background: var(--bg); border-radius: 8px;
  flex-wrap: wrap;
}

.field-add-btn {
  background: white;
  border: 1px solid var(--border);
  padding: 8px 14px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 600;
  display: inline-flex; align-items: center; gap: 6px;
  transition: all 0.15s;
}

.field-add-btn:hover {
  border-color: var(--primary); color: var(--primary);
  background: var(--primary-light);
}

/* Signature pad */
.signature-pad-container {
  background: white;
  border: 2px dashed var(--border);
  border-radius: 8px;
  padding: 12px;
}

.signature-pad {
  border: 1px solid var(--border);
  border-radius: 6px;
  cursor: crosshair;
  touch-action: none;
  background: white;
  display: block;
  width: 100%;
  height: 200px;
}

.signature-actions { display: flex; gap: 8px; margin-top: 10px; }

/* Modal */
.modal-backdrop {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.5);
  display: flex; align-items: center; justify-content: center;
  z-index: 100; padding: 20px;
}

.modal {
  background: white;
  border-radius: 12px;
  max-width: 600px;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: var(--shadow-lg);
}

.modal-header {
  padding: 18px 24px 12px;
  border-bottom: 1px solid var(--border);
  display: flex; justify-content: space-between; align-items: center;
}

.modal-title { font-size: 17px; font-weight: 700; }

.modal-close {
  background: transparent; border: none;
  font-size: 22px; color: var(--text-sub);
  width: 30px; height: 30px;
  border-radius: 6px;
}

.modal-body { padding: 20px 24px; }
.modal-footer {
  padding: 12px 24px 20px;
  display: flex; gap: 8px; justify-content: flex-end;
}

/* Toast */
.toast {
  position: fixed; bottom: 24px; left: 50%;
  transform: translateX(-50%);
  background: var(--secondary);
  color: white;
  padding: 12px 20px;
  border-radius: 8px;
  font-size: 13px;
  z-index: 300;
  box-shadow: var(--shadow-lg);
}

/* Loading */
.loading-overlay {
  position: fixed; inset: 0;
  background: rgba(255,255,255,0.9);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  z-index: 200; gap: 12px;
}

.spinner {
  width: 40px; height: 40px;
  border: 3px solid var(--border);
  border-top-color: var(--primary);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

/* Status badge */
.status-badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 10px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 600;
}
.status-sent { background: #E3F2FD; color: #1565C0; }
.status-viewed { background: #FFF3E0; color: #E65100; }
.status-signed { background: #E8F5E9; color: #2E7D32; }
.status-expired { background: #FFEBEE; color: #C62828; }
.status-cancelled { background: #F5F5F5; color: #616161; }

/* Contract list */
.contract-list { display: grid; gap: 10px; }

.contract-item {
  background: white;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px 18px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  cursor: pointer;
  transition: all 0.15s;
}

.contract-item:hover {
  border-color: var(--primary);
  box-shadow: var(--shadow);
}

.contract-info { flex: 1; min-width: 0; }
.contract-title {
  font-size: 14px; font-weight: 600;
  margin-bottom: 3px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.contract-meta { font-size: 11px; color: var(--text-sub); }

/* Empty state */
.empty {
  padding: 60px 20px;
  text-align: center;
  color: var(--text-sub);
}
.empty-icon { font-size: 56px; margin-bottom: 12px; opacity: 0.4; }
.empty-title { font-size: 17px; font-weight: 700; margin-bottom: 6px; color: var(--text); }
.empty-desc { font-size: 13px; margin-bottom: 20px; }

/* Recipient sign view specific */
.sign-view { 
  padding-top: 100px !important; /* fixed header 여백 */
}
.sign-view .doc-container { max-width: 900px; margin: 0 auto; }

.sign-header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 100;
  background: white;
  box-shadow: 0 2px 12px rgba(0,0,0,0.1);
  border-bottom: 3px solid var(--primary);
}

.sign-header-inner {
  max-width: 1200px;
  margin: 0 auto;
  padding: 12px 24px;
}

.sign-header-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}

.sign-header-title { font-size: 16px; font-weight: 700; margin-bottom: 2px; }
.sign-header-meta { font-size: 11px; color: var(--text-sub); }

.sign-progress {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 10px;
  background: var(--bg);
  border-radius: 12px;
  font-size: 11px;
  font-weight: 600;
  color: var(--text-sub);
}

.sign-progress.complete { background: #DFF5E5; color: var(--success); }

.sign-message-box {
  margin-top: 8px;
  padding: 6px 12px;
  background: var(--bg);
  border-radius: 6px;
  font-size: 12px;
  color: var(--text-sub);
}

@media (max-width: 600px) {
  .sign-view { padding-top: 130px !important; }
  .sign-header-inner { padding: 10px 14px; }
}

/* 인증 화면 */
.auth-view {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 70vh;
  padding-top: 0 !important;
}

.auth-card {
  background: white;
  border-radius: 16px;
  padding: 40px 32px;
  max-width: 440px;
  width: 100%;
  text-align: center;
  box-shadow: 0 8px 32px rgba(0,0,0,0.08);
  border-top: 4px solid var(--primary);
}

.auth-icon {
  font-size: 44px;
  margin-bottom: 12px;
}

.auth-title {
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 8px;
}

.auth-contract-title {
  font-size: 15px;
  color: var(--primary-dark);
  font-weight: 600;
  padding: 10px 14px;
  background: var(--primary-light);
  border-radius: 8px;
  margin: 16px 0;
}

.auth-desc {
  font-size: 13px;
  color: var(--text-sub);
  margin-bottom: 16px;
  line-height: 1.6;
}

.auth-hint {
  font-size: 11px;
  color: var(--text-sub);
  margin-top: 8px;
  padding: 8px 12px;
  background: var(--bg);
  border-radius: 6px;
}

.auth-error {
  color: var(--error);
  font-size: 12px;
  margin-top: 8px;
  padding: 8px 12px;
  background: #FCE4E4;
  border-radius: 6px;
  border: 1px solid #F5C6C6;
}

/* Mobile */
@media (max-width: 768px) {
  .header { padding: 12px 16px; }
  .main { padding: 16px; }
  .card { padding: 18px; }
  .form-row { grid-template-columns: 1fr; }
  .doc-content { padding: 20px 24px; }
  .field-toolbar { justify-content: center; }
}

</style>
</head>

// ============ Utilities ============
const uuid = () => {

  return 'id-' + Date.now() + '-' + Math.random().toString(36).slice(2, 9);
};

const generateToken = () => {

const fmtDate = (iso) => {
  if (!iso) return '-';
  const d = new Date(iso);
  const now = new Date();
  const diff = (now - d) / 1000;
  if (diff < 60) return '방금';
  if (diff < 3600) return Math.floor(diff/60) + '분 전';
  if (diff < 86400) return Math.floor(diff/3600) + '시간 전';
  if (diff < 86400 * 7) return Math.floor(diff/86400) + '일 전';
  return d.toLocaleDateString('ko-KR', { year: '2-digit', month: 'short', day: 'numeric' });
};

// Toast
let toastTimer = null;
function showToast(msg) {
  const existing = document.querySelector('.toast');
  if (existing) existing.remove();

}

// ============ Signature Pad Component ============
function SignaturePad({ onSave, onCancel, initialData }) {
  const canvasRef = useRef(null);
  const [drawing, setDrawing] = useState(false);
  const [hasSignature, setHasSignature] = useState(false);
  
  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    
    // 캔버스 크기 설정 (고해상도)
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * 2;
    canvas.height = rect.height * 2;
    const ctx = canvas.getContext('2d');
    ctx.scale(2, 2);
    ctx.strokeStyle = '#1A1F26';
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    
    // 이전 서명 로드
    if (initialData) {
      const img = new Image();
      img.onload = () => {
        ctx.drawImage(img, 0, 0, rect.width, rect.height);
        setHasSignature(true);
      };
      img.src = initialData;
    }
  }, [initialData]);
  
  const getPos = (e) => {
    const canvas = canvasRef.current;
    const rect = canvas.getBoundingClientRect();
    const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
    const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
    return { x, y };
  };
  
  const start = (e) => {
    e.preventDefault();
    setDrawing(true);
    const pos = getPos(e);
    const ctx = canvasRef.current.getContext('2d');
    ctx.beginPath();
    ctx.moveTo(pos.x, pos.y);
  };
  
  const draw = (e) => {
    if (!drawing) return;
    e.preventDefault();
    const pos = getPos(e);
    const ctx = canvasRef.current.getContext('2d');
    ctx.lineTo(pos.x, pos.y);
    ctx.stroke();
    setHasSignature(true);
  };
  
  const end = () => {
    setDrawing(false);
  };
  
  const clear = () => {
    const canvas = canvasRef.current;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    setHasSignature(false);
  };
  
  const save = () => {
    if (!hasSignature) return alert('서명을 그려주세요');
    const data = canvasRef.current.toDataURL('image/png');
    onSave(data);
  };
  
  return h('div', { className: 'signature-pad-container' },
    h('canvas', {
      ref: canvasRef,
      className: 'signature-pad',
      onMouseDown: start, onMouseMove: draw, onMouseUp: end, onMouseLeave: end,
      onTouchStart: start, onTouchMove: draw, onTouchEnd: end,
    }),
    h('div', { className: 'signature-actions' },
      h('button', { className: 'btn-ghost', onClick: clear }, '🗑 지우기'),
      onCancel ? h('button', { className: 'btn-ghost', onClick: onCancel }, '취소') : null,
      h('button', { className: 'btn-primary', onClick: save, disabled: !hasSignature }, '✅ 서명 완료'),
    ),
  );
}

// ============ Auth ============
function useAuth() {
  const [user, setUser] = useState(null);
  const [loading, setLoading] = useState(true);
  const [notAllowed, setNotAllowed] = useState(false);
  
  const checkUser = (session) => {
    const u = session?.user || null;
    if (!u) {
      setUser(null);
      setNotAllowed(false);
      return;
    }
    const email = (u.email || '').toLowerCase();
    if (!ALLOWED_EMAILS.includes(email)) {
      // 허용되지 않은 이메일 → 자동 로그아웃
      setUser(null);
      setNotAllowed(true);
      supabase.auth.signOut();
      return;
    }
    setUser(u);
    setNotAllowed(false);
  };
  
  useEffect(() => {
    supabase.auth.getSession().then(({ data }) => {
      checkUser(data.session);
      setLoading(false);
    });
    const { data: sub } = supabase.auth.onAuthStateChange((_, session) => {
      checkUser(session);
    });
    return () => sub.subscription.unsubscribe();
  }, []);
  
  return { user, loading, notAllowed, resetNotAllowed: () => setNotAllowed(false) };
}

function LoginModal({ onClose }) {
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [error, setError] = useState('');
  const [loading, setLoading] = useState(false);
  
  const handleSubmit = async () => {
    setError('');

      setError('이 계정은 접근 권한이 없습니다.');

// ============ Sender: Contract Editor ============
function ContractEditor({ user, onDone }) {
  const [step, setStep] = useState(1); // 1: upload, 2: fields, 3: send
  const [file, setFile] = useState(null);
  const [html, setHtml] = useState('');
  const [title, setTitle] = useState('');
  const [message, setMessage] = useState('');
  const [recipientEmail, setRecipientEmail] = useState('');
  const [recipientName, setRecipientName] = useState('');
  const [fields, setFields] = useState([]);
  const [selectedFieldId, setSelectedFieldId] = useState(null);
  const [loading, setLoading] = useState(false);
  const [dragOver, setDragOver] = useState(false);
  const [addingField, setAddingField] = useState(null); // field type to add
  const [imgLoaded, setImgLoaded] = useState(0);
  const fileInputRef = useRef(null);
  const docRef = useRef(null);
  
  // 이미지 로드 감지 (배치 시 정확한 문서 크기 확보)
  useEffect(() => {
    if (!html || !docRef.current || step !== 2) return;
    const images = docRef.current.querySelectorAll('img');
    if (images.length === 0) return;
    
    const onLoad = () => setImgLoaded(x => x + 1);
    
    images.forEach(img => {
      if (img.complete) onLoad();
      else {
        img.addEventListener('load', onLoad);
        img.addEventListener('error', onLoad);
      }
    });
    
    return () => {
      images.forEach(img => {
        img.removeEventListener('load', onLoad);
        img.removeEventListener('error', onLoad);
      });
    };
  }, [html, step]);
  
  const handleFile = async (file) => {
    if (!file) return;
    if (!file.name.match(/\.(docx?|html?|txt|pdf)$/i)) {
      alert('.docx, .doc, .html, .txt, .pdf 파일만 지원합니다');
      return;
    }
    setLoading(true);
    setFile(file);
    setTitle(file.name.replace(/\.[^.]+$/, ''));
    try {
      const buffer = await file.arrayBuffer();
      
      if (file.name.match(/\.pdf$/i)) {
        // PDF 처리 - 각 페이지를 이미지로 변환 (원본 완벽 보존)
        const pdf = await window.pdfjsLib.getDocument({ data: buffer }).promise;
        let combinedHtml = '<div style="display:flex;flex-direction:column;gap:16px;">';
        for (let i = 1; i <= pdf.numPages; i++) {
          const page = await pdf.getPage(i);
          const viewport = page.getViewport({ scale: 2.0 });
          const canvas = document.createElement('canvas');
          canvas.width = viewport.width;
          canvas.height = viewport.height;
          const ctx = canvas.getContext('2d');
          await page.render({ canvasContext: ctx, viewport }).promise;
          const dataUrl = canvas.toDataURL('image/png');
          combinedHtml += '<img src="' + dataUrl + '" style="width:100%;display:block;border:1px solid #E1E6EB;" alt="Page ' + i + '"/>';
        }
        combinedHtml += '</div>';
        setHtml(combinedHtml);
      } else if (file.name.match(/\.docx$/i)) {
        // Word 처리 - 이미지 base64 인라인 강제
        const result = await window.mammoth.convertToHtml({ arrayBuffer: buffer }, {
          convertImage: window.mammoth.images.imgElement(function(image) {
            return image.read('base64').then(function(imageBuffer) {
              return {
                src: 'data:' + image.contentType + ';base64,' + imageBuffer,
                style: 'max-width:200px;vertical-align:middle;display:inline-block;'
              };
            });
          })
        });
        setHtml(result.value);
      } else if (file.name.match(/\.html?$/i)) {
        const text = new TextDecoder().decode(buffer);
        setHtml(text);
      } else if (file.name.match(/\.txt$/i)) {
        const text = new TextDecoder().decode(buffer);
        setHtml('<pre style="white-space:pre-wrap;font-family:inherit">' + 
          text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</pre>');
      }
      setStep(2);
    } catch (e) {
      alert('파일 처리 실패: ' + e.message);
    } finally {
      setLoading(false);
    }
  };
  
  const handleDrop = (e) => {
    e.preventDefault();
    setDragOver(false);
    const file = e.dataTransfer.files[0];
    handleFile(file);
  };
  
  const handleDocClick = (e) => {
    if (!addingField) return;
    // docRef (wrapper) 기준으로 좌표 계산 - doc-content 를 감싸는 relative wrapper
    const wrapEl = docRef.current;
    if (!wrapEl) return;
    const rect = wrapEl.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    const w = wrapEl.offsetWidth;
    const hh = wrapEl.offsetHeight;
    const fieldType = FIELD_TYPES.find(f => f.id === addingField);
    const newField = {
      id: uuid(),
      type: addingField,
      xPercent: ((x - fieldType.width / 2) / w) * 100,
      yPercent: ((y - fieldType.height / 2) / hh) * 100,
      width: fieldType.width,
      height: fieldType.height,
      value: null,
    };
    setFields([...fields, newField]);
    setSelectedFieldId(newField.id);
    setAddingField(null);
  };
  
  const removeField = (id) => {
    setFields(fields.filter(f => f.id !== id));
    setSelectedFieldId(null);
  };
  
  const startFieldDrag = (e, field) => {
    e.stopPropagation();
    if (e.target.classList.contains('field-remove')) return;
    setSelectedFieldId(field.id);
    const wrapEl = docRef.current;
    if (!wrapEl) return;
    const w = wrapEl.offsetWidth;
    const hh = wrapEl.offsetHeight;
    const startX = e.clientX, startY = e.clientY;
    const origXPercent = field.xPercent != null ? field.xPercent : (field.x / w * 100);
    const origYPercent = field.yPercent != null ? field.yPercent : (field.y / hh * 100);
    
    const onMove = (ev) => {
      const dx = ev.clientX - startX;
      const dy = ev.clientY - startY;
      const newXPercent = origXPercent + (dx / w) * 100;
      const newYPercent = origYPercent + (dy / hh) * 100;
      setFields(fs => fs.map(f => 
        f.id === field.id 
          ? { ...f, xPercent: newXPercent, yPercent: newYPercent, x: undefined, y: undefined } 
          : f
      ));
    };
    const onUp = () => {
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
    };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  };
  
  const handleSend = async () => {
    if (!recipientEmail) return alert('수신자 이메일을 입력해주세요');
    if (fields.filter(f => f.type === 'signature').length === 0) {
      if (!confirm('서명란이 없습니다. 그래도 발송할까요?')) return;
    }
    setLoading(true);
    try {
      const token = generateToken();
      const { data, error } = await supabase.from('contracts').insert({
        sender_email: user.email,
        sender_name: user.email.split('@')[0],
        recipient_email: recipientEmail,
        recipient_name: recipientName || null,
        title: title || '무제 계약',
        message: message || null,
        original_html: html,
        fields: fields,
        sign_token: token,
        status: 'sent',
        sent_at: new Date().toISOString(),
        user_id: user.id,
      }).select().single();
      
      if (error) throw error;
      
      // mailto: 링크 생성
      const signUrl = window.location.origin + window.location.pathname + '?sign=' + token;
      const subject = encodeURIComponent('[말계약] ' + (title || '서명 요청'));
      const body = encodeURIComponent(
        (recipientName || '안녕하세요') + '님,\n\n' +
        (user.email.split('@')[0]) + '님이 계약서 서명을 요청했습니다.\n\n' +
        (message ? '메시지:\n' + message + '\n\n' : '') +
        '━━━━━━━━━━━━━━━━━━━━━\n' +
        '👉 아래 링크를 클릭하여 서명해주세요\n\n' +
        signUrl + '\n\n' +
        '━━━━━━━━━━━━━━━━━━━━━\n\n' +
        '🔒 보안 안내:\n' +
        '링크 접속 시 발신자 이메일(' + user.email + ')을 입력해야 계약서를 볼 수 있습니다.\n\n' +
        '※ 링크가 클릭되지 않으면 위 주소를 복사해서 브라우저 주소창에 붙여넣기 하세요.\n' +
        '※ 링크는 30일간 유효합니다.\n\n' +
        '— 말계약 (sapfiori.co.kr)'
      );
      window.location.href = 'mailto:' + recipientEmail + '?subject=' + subject + '&body=' + body;
      
      showToast('계약 발송 완료 · 메일 클라이언트를 확인하세요');
      onDone();
    } catch (e) {
      alert('발송 실패: ' + e.message);
    } finally {
      setLoading(false);
    }
  };
  
  // Step 1: Upload
  if (step === 1) {
    return h('div', { className: 'card' },
      h('div', { className: 'card-title' }, '📄 계약서 업로드'),
      h('div', { className: 'card-desc' }, 
        h('div', { style: { marginBottom: 6 } }, 'PDF, Word (.docx), HTML, 또는 텍스트 파일'),
        h('div', { style: { fontSize: 11, color: 'var(--warning)' } },
          '💡 도장·이미지가 있는 계약서는 ',
          h('strong', null, 'PDF로 변환 후 업로드'),
          ' 하시면 원본 서식이 완벽 보존됩니다',
        ),
      ),
      h('div', { 
        className: 'upload-box' + (dragOver ? ' dragover' : ''),
        onClick: () => fileInputRef.current?.click(),
        onDragOver: (e) => { e.preventDefault(); setDragOver(true); },
        onDragLeave: () => setDragOver(false),
        onDrop: handleDrop,
      },
        h('div', { className: 'upload-icon' }, '📤'),
        h('div', { className: 'upload-title' }, '파일 드래그 또는 클릭'),
        h('div', { className: 'upload-hint' }, '.pdf ⭐ · .docx · .doc · .html · .txt · 최대 10MB'),
      ),
      h('input', {
        type: 'file', ref: fileInputRef,
        accept: '.pdf,.docx,.doc,.html,.htm,.txt',
        style: { display: 'none' },
        onChange: (e) => handleFile(e.target.files[0]),
      }),
      h('div', { 
        style: { 
          background: 'var(--bg)', padding: 14, borderRadius: 8, 
          marginTop: 16, fontSize: 12, color: 'var(--text-sub)' 
        } 
      },
        h('div', { style: { fontWeight: 700, marginBottom: 6, color: 'var(--text)' } }, '📎 Word에 도장 있으면?'),
        h('div', { style: { marginLeft: 8, lineHeight: 1.8 } },
          '1. Word 열기 → 파일 → 다른 이름으로 저장', h('br'),
          '2. 파일 형식: ', h('strong', null, 'PDF'), h('br'),
          '3. 저장 → 여기에 그 PDF 업로드', h('br'),
          '4. 원본 서식·도장·이미지 완벽 유지',
        ),
      ),
    );
  }
  
  // Step 2: Field placement
  if (step === 2) {
    return h(Fragment, null,
      h('div', { className: 'card' },
        h('div', { className: 'card-title' }, '📌 필드 배치'),
        h('div', { className: 'card-desc' }, 
          addingField 
            ? '📍 문서를 클릭해서 ' + FIELD_TYPES.find(f => f.id === addingField)?.label + ' 배치 위치 선택'
            : '아래 버튼 클릭 → 문서 원하는 위치 클릭'
        ),
        h('div', { className: 'field-toolbar' },
          FIELD_TYPES.map(t =>
            h('button', {
              key: t.id,
              className: 'field-add-btn',
              onClick: () => setAddingField(addingField === t.id ? null : t.id),
              style: addingField === t.id ? { 
                background: 'var(--primary)', color: 'white', borderColor: 'var(--primary)' 
              } : {},
            }, '+ ', t.label)
          ),
        ),
        h('div', { 
          className: 'doc-container', 
          style: { cursor: addingField ? 'crosshair' : 'default' },
          onClick: handleDocClick,
        },
          h('div', { 
            ref: docRef,
            style: { position: 'relative' },
          },
            h('div', { 
              className: 'doc-content',
              dangerouslySetInnerHTML: { __html: html } 
            }),
            fields.map(f => {
              const type = FIELD_TYPES.find(t => t.id === f.type);
              const useLeft = f.xPercent != null ? (f.xPercent + '%') : f.x;
              const useTop = f.yPercent != null ? (f.yPercent + '%') : f.y;
              return h('div', {
                key: f.id,
                className: 'field-overlay' + (f.type === 'signature' ? ' signature' : '') + 
                  (selectedFieldId === f.id ? ' selected' : ''),
                style: {
                  left: useLeft, top: useTop,
                  width: f.width, height: f.height,
                },
                onMouseDown: (e) => startFieldDrag(e, f),
                onClick: (e) => e.stopPropagation(),
              },
                type.icon + ' ' + type.label.split(' ')[1],
                h('button', {
                  className: 'field-remove',
                  onClick: (e) => { e.stopPropagation(); removeField(f.id); },
                }, '×'),
              );
            }),
          ),
        ),
      ),
      h('div', { style: { display: 'flex', justifyContent: 'space-between', marginTop: 16 } },
        h('button', { className: 'btn-ghost', onClick: () => setStep(1) }, '← 다시 업로드'),
        h('button', { 
          className: 'btn-primary', 
          onClick: () => setStep(3),
        }, '다음 → 수신자 정보'),
      ),
    );
  }
  
  // Step 3: Recipient & Send
  return h(Fragment, null,
    h('div', { className: 'card' },
      h('div', { className: 'card-title' }, '📧 수신자 정보'),
      h('div', { className: 'form-row col-1' },
        h('label', { className: 'field-label' }, '계약 제목 ', h('span', { className: 'field-required' }, '*')),
        h('input', {
          className: 'field-input',
          value: title, onChange: (e) => setTitle(e.target.value),
          placeholder: '예: 프리랜서 개발 용역 계약서',
        }),
      ),
      h('div', { className: 'form-row' },
        h('div', null,
          h('label', { className: 'field-label' }, '수신자 이메일 ', h('span', { className: 'field-required' }, '*')),
          h('input', {
            className: 'field-input', type: 'email',
            value: recipientEmail, onChange: (e) => setRecipientEmail(e.target.value),
            placeholder: 'recipient@example.com',
          }),
        ),
        h('div', null,
          h('label', { className: 'field-label' }, '수신자 이름'),
          h('input', {
            className: 'field-input',
            value: recipientName, onChange: (e) => setRecipientName(e.target.value),
            placeholder: '홍길동',
          }),
        ),
      ),
      h('div', { className: 'form-row col-1' },
        h('label', { className: 'field-label' }, '메시지 (선택)'),
        h('textarea', {
          className: 'field-textarea',
          value: message, onChange: (e) => setMessage(e.target.value),
          placeholder: '수신자에게 전달할 메시지...',
          rows: 3,

      h('div', { style: { background: 'var(--bg)', padding: 12, borderRadius: 8, fontSize: 12, marginTop: 12 } },
        h('div', { style: { fontWeight: 700, marginBottom: 6 } }, '📋 발송 정보'),
        h('div', null, '• 서명 필드: ', fields.filter(f => f.type === 'signature').length, '개'),
        h('div', null, '• 총 필드: ', fields.length, '개'),

// ============ Sender: Contract List ============
function ContractList({ user, onNew, onView }) {
  const [contracts, setContracts] = useState([]);
  const [loading, setLoading] = useState(true);
  
  const load = async () => {
    setLoading(true);
    const { data, error } = await supabase
      .from('contracts')
      .select('*')
      .eq('user_id', user.id)
      .order('created_at', { ascending: false });
    if (!error) setContracts(data || []);
    setLoading(false);
  };
  
  useEffect(() => { load(); }, [user.id]);
  
  const handleDelete = async (contract, e) => {
    e.stopPropagation();
    if (!confirm('"' + contract.title + '"\n\n이 계약을 삭제하시겠습니까?\n(수신자가 서명 링크로 접속해도 볼 수 없게 됩니다)')) return;
    try {
      const { error } = await supabase
        .from('contracts')
        .delete()
        .eq('id', contract.id);
      if (error) throw error;
      setContracts(cs => cs.filter(c => c.id !== contract.id));
      showToast('삭제됨');
    } catch (e) {
      alert('삭제 실패: ' + e.message);
    }
  };
  
  // Realtime subscription
  useEffect(() => {
    const channel = supabase.channel('contracts-' + user.id)
      .on('postgres_changes', 
        { event: '*', schema: 'public', table: 'contracts', filter: 'user_id=eq.' + user.id },
        (payload) => {
          if (payload.eventType === 'UPDATE') {
            setContracts(cs => cs.map(c => c.id === payload.new.id ? payload.new : c));
          } else if (payload.eventType === 'DELETE') {
            setContracts(cs => cs.filter(c => c.id !== payload.old.id));
          }
        }
      )
      .subscribe();

// ============ Sender: Contract Detail ============
function ContractDetail({ contract, onBack, onRefresh }) {
  const [c, setC] = useState(contract);
  const [imgLoaded, setImgLoaded] = useState(0);
  const detailRef = useRef(null);
  
  useEffect(() => {
    const channel = supabase.channel('contract-' + c.id)
      .on('postgres_changes', 
        { event: 'UPDATE', schema: 'public', table: 'contracts', filter: 'id=eq.' + c.id },
        (payload) => setC(payload.new)
      )
      .subscribe();
    return () => supabase.removeChannel(channel);
  }, [c.id]);
  
  // 이미지 로드 감지 → 필드 위치 재계산
  useEffect(() => {
    if (!detailRef.current) return;
    const images = detailRef.current.querySelectorAll('img');
    if (images.length === 0) return;
    
    const onLoad = () => setImgLoaded(x => x + 1);
    
    images.forEach(img => {

      else {
        img.addEventListener('load', onLoad);
        img.addEventListener('error', onLoad);
      }
    });
    
    return () => {
      images.forEach(img => {
        img.removeEventListener('load', onLoad);
        img.removeEventListener('error', onLoad);
      });
    };
  }, [c.original_html, c.signed_html]);

// ============ Recipient: Sign View ============
function SignView({ token }) {
  const [contract, setContract] = useState(null);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [fieldValues, setFieldValues] = useState({});
  const [signingFieldId, setSigningFieldId] = useState(null);
  const [submitting, setSubmitting] = useState(false);
  const [done, setDone] = useState(false);
  const [imgLoaded, setImgLoaded] = useState(0);
  const [verified, setVerified] = useState(false);
  const [authEmail, setAuthEmail] = useState('');
  const [authError, setAuthError] = useState('');
  const [authAttempts, setAuthAttempts] = useState(0);
  const docRef = useRef(null);
  
  useEffect(() => {
    load();
  }, [token]);
  
  // 이전 인증 확인 (세션)
  useEffect(() => {
    if (!contract) return;
    const key = 'contract-verified-' + contract.id;
    if (sessionStorage.getItem(key) === 'true') {
      setVerified(true);
    }
  }, [contract]);
  
  const verify = () => {
    if (!contract) return;
    const input = authEmail.toLowerCase().trim();
    const expected = (contract.sender_email || '').toLowerCase().trim();
    if (!input) {
      setAuthError('이메일을 입력해주세요');
      return;
    }
    if (input === expected) {
      sessionStorage.setItem('contract-verified-' + contract.id, 'true');
      setVerified(true);
      setAuthError('');
    } else {
      setAuthAttempts(a => a + 1);
      setAuthError('발신자 이메일이 일치하지 않습니다 (' + (authAttempts + 1) + '회)');
    }
  };
  
  // 이미지 로드 감지 → 필드 위치 재계산 (CSS % 자동 재계산 트리거)
  useEffect(() => {
    if (!contract || !docRef.current) return;
    const images = docRef.current.querySelectorAll('img');
    if (images.length === 0) return;
    
    let count = 0;
    const onLoad = () => {
      count++;
      setImgLoaded(x => x + 1); // 강제 리렌더 트리거
    };
    
    images.forEach(img => {
      if (img.complete) {
        count++;
      } else {
        img.addEventListener('load', onLoad);
        img.addEventListener('error', onLoad);
      }
    });
    
    // 초기 카운트가 있으면 한 번 트리거
    if (count > 0) setImgLoaded(x => x + 1);
    
    return () => {
      images.forEach(img => {
        img.removeEventListener('load', onLoad);
        img.removeEventListener('error', onLoad);
      });
    };
  }, [contract]);
  
  const load = async () => {
    setLoading(true);
    try {
      const { data, error } = await supabase
        .from('contracts')
        .select('*')
        .eq('sign_token', token)
        .single();
      if (error) throw error;
      if (!data) throw new Error('유효하지 않은 링크입니다');
      if (data.status === 'signed') throw new Error('이미 서명 완료된 계약입니다');
      if (data.status === 'expired' || (data.expires_at && new Date(data.expires_at) < new Date())) {
        throw new Error('만료된 링크입니다');
      }
      setContract(data);
      
      // 첫 열람 표시
      if (data.status === 'sent') {
        await supabase.from('contracts').update({
          status: 'viewed',
          viewed_at: new Date().toISOString(),
        }).eq('id', data.id);
      }
      
      // 기존 값 로드
      const values = {};
      (data.fields || []).forEach(f => {
        if (f.value != null) values[f.id] = f.value;
      });
      setFieldValues(values);
    } catch (e) {
      setError(e.message);
    } finally {
      setLoading(false);
    }
  };
  
  const setFieldValue = (id, value) => {
    setFieldValues(v => ({ ...v, [id]: value }));
  };
  
  const handleSubmit = async () => {
    const required = (contract.fields || []).filter(f => f.type === 'signature');
    for (const f of required) {
      if (!fieldValues[f.id]) return alert('서명을 완료해주세요');
    }
    
    setSubmitting(true);
    try {
      // 필드에 값 채우기
      const filledFields = (contract.fields || []).map(f => ({
        ...f, value: fieldValues[f.id] || null,
      }));
      
      // 서명 이미지 (첫 서명)
      const firstSig = filledFields.find(f => f.type === 'signature');
      const sigData = firstSig?.value;
      
      // PDF 생성 대기 (DOM 반영 위해)
      await new Promise(r => setTimeout(r, 300));
      
      // 서명된 화면을 PDF 로 변환
      let signedPdfBase64 = null;
      try {
        const target = docRef.current;
        if (target && window.html2pdf) {
          const opt = {
            margin: 8,
            filename: contract.title + '_서명완료.pdf',
            image: { type: 'jpeg', quality: 0.95 },
            html2canvas: { scale: 2, useCORS: true, logging: false },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
          };
          const worker = window.html2pdf().set(opt).from(target);
          const blob = await worker.output('blob');
          signedPdfBase64 = await new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = reject;
            reader.readAsDataURL(blob);
          });
        }
      } catch (pdfErr) {
        console.warn('PDF 생성 실패 (계속 저장):', pdfErr);
      }
      
      // Supabase 저장
      const updateData = {
        status: 'signed',
        signed_at: new Date().toISOString(),
        fields: filledFields,
        signed_html: contract.original_html,
        signature_data: sigData,
        user_agent: navigator.userAgent,
      };
      if (signedPdfBase64) updateData.signed_pdf = signedPdfBase64;
      
      const { error } = await supabase.from('contracts').update(updateData).eq('id', contract.id);
      
      if (error) throw error;
      
      // 로컬 contract 업데이트 (완료 화면에서 다운로드용)
      setContract(c => ({ ...c, ...updateData }));
      setDone(true);
    } catch (e) {
      alert('서명 저장 실패: ' + e.message);
    } finally {
      setSubmitting(false);
    }
  };
  
  const buildSignedHtml = (originalHtml, fields) => {
    // 원본 HTML은 그대로, 서명 데이터는 fields에서
    // signed_html 은 렌더링 시 fields 오버레이로 처리
    return originalHtml;
  };
  
  if (loading) return h('div', { className: 'main', style: { textAlign: 'center', padding: 60 } }, '로딩 중...');
  if (error) return h('div', { className: 'main' },
    h('div', { className: 'card empty' },
      h('div', { className: 'empty-icon' }, '❌'),
      h('div', { className: 'empty-title' }, '오류'),
      h('div', { className: 'empty-desc' }, error),
    ),
  );
  
  if (done) {
    const downloadMyCopy = () => {
      if (!contract.signed_pdf) {
        alert('PDF가 아직 생성 중입니다. 잠시 후 다시 시도해주세요.');
        return;
      }
      const a = document.createElement('a');
      a.href = contract.signed_pdf;
      a.download = contract.title + '_서명완료.pdf';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
    };
    
    const notifySender = () => {
      const subject = encodeURIComponent('[말계약] 서명 완료 - ' + contract.title);
      const dashboardUrl = window.location.origin + window.location.pathname;
      const body = encodeURIComponent(
        (contract.sender_name || '안녕하세요') + '님,\n\n' +
        '요청하신 계약 "' + contract.title + '"의 서명을 완료했습니다.\n\n' +
        '━━━━━━━━━━━━━━━━━━━━━\n' +
        '📋 계약: ' + contract.title + '\n' +
        '✅ 서명일: ' + new Date().toLocaleString('ko-KR') + '\n' +
        '━━━━━━━━━━━━━━━━━━━━━\n\n' +
        '완성본은 말계약 대시보드에서 다운로드하실 수 있습니다:\n' +
        dashboardUrl + '\n\n' +
        '감사합니다.\n\n' +
        '— ' + (authEmail || contract.recipient_email)
      );
      window.location.href = 'mailto:' + contract.sender_email + '?subject=' + subject + '&body=' + body;
    };
    
    return h('div', { className: 'main sign-view', style: { paddingTop: '40px !important' } },
      h('div', { className: 'auth-card', style: { maxWidth: 500, margin: '40px auto' } },
        h('div', { className: 'auth-icon' }, '✅'),
        h('div', { className: 'auth-title', style: { color: 'var(--success)', fontSize: 22 } }, 
          '서명 완료!'
        ),
        h('div', { className: 'auth-contract-title' }, contract.title),
        h('div', { className: 'auth-desc' },
          h('strong', null, contract.sender_name || contract.sender_email),
          '님에게 서명 완료가 통보됩니다.',
          h('br'),
          '아래 버튼으로 사본을 받으실 수 있습니다.',
        ),
        h('div', { style: { display: 'flex', flexDirection: 'column', gap: 10, marginTop: 20 } },
          h('button', {
            className: 'btn-primary',
            onClick: downloadMyCopy,
            style: { padding: '14px', fontSize: 14 },
          }, '📥 내 사본 다운로드 (PDF)'),
          h('button', {
            onClick: notifySender,
            style: {
              padding: '12px', fontSize: 13, fontWeight: 600,
              background: 'white', color: 'var(--primary)',
              border: '1px solid var(--primary)', borderRadius: 8,
              cursor: 'pointer',
            },
          }, '📧 발신자에게 완료 알림 보내기'),
        ),
        h('div', { style: { fontSize: 11, color: 'var(--text-sub)', marginTop: 20, lineHeight: 1.6 } },
          '💡 안내', h('br'),
          '• 발신자는 실시간으로 서명 완료를 확인합니다', h('br'),
          '• 사본은 언제든 다시 받으실 수 있게 이메일 알림 보내주세요', h('br'),
          '• 브라우저 창을 닫으셔도 됩니다',
        ),
      ),
    );
  }
  
  const requiredFields = (contract.fields || []).filter(f => f.type === 'signature');
  const allSigned = requiredFields.every(f => fieldValues[f.id]);
  
  // 인증 안 되면 인증 화면만 표시
  if (!verified) {

          '계약을 확인하려면 ',
          h('strong', null, '발신자 이메일 주소'),
          '를 입력해주세요.',
        ),
        h('input', { 
          type: 'email',
          className: 'field-input',
          value: authEmail,
          onChange: (e) => setAuthEmail(e.target.value),
          onKeyDown: (e) => { if (e.key === 'Enter') verify(); },
          placeholder: 'sender@example.com',
          autoFocus: true,
          style: { marginBottom: 8 },
        }),
        maskedHint ? h('div', { className: 'auth-hint' }, 
          '💡 힌트: ', h('code', null, maskedHint),
        ) : null,
        authError ? h('div', { className: 'auth-error' }, '❌ ', authError) : null,
        h('button', { 
          className: 'btn-primary',
          onClick: verify,
          style: { width: '100%', marginTop: 16, padding: '12px', fontSize: 14 },
        }, '🔓 확인'),
        h('div', { style: { fontSize: 10, color: 'var(--text-sub)', marginTop: 16 } },
          '※ 이 계약을 열람할 수 있는 사람만 발신자 이메일을 알 수 있습니다.',
        ),
      ),
    );
  }
  
  return h('div', { className: 'main sign-view' },
    h('div', { className: 'sign-header' },
      h('div', { className: 'sign-header-inner' },
        h('div', { className: 'sign-header-top' },
          h('div', { style: { flex: 1, minWidth: 0 } },
            h('div', { className: 'sign-header-title' }, '📝 ', contract.title),
            h('div', { className: 'sign-header-meta' },
              contract.sender_name + ' (' + contract.sender_email + ') 님이 서명 요청',
            ),
          ),
          h('div', { style: { display: 'flex', alignItems: 'center', gap: 10, flexShrink: 0 } },
            requiredFields.length > 0 
              ? h('div', { 
                  className: 'sign-progress' + (allSigned ? ' complete' : ''),
                }, 
                  allSigned ? '✓' : '📌',
                  ' 서명 ' + requiredFields.filter(f => fieldValues[f.id]).length + '/' + requiredFields.length,
                )
              : null,
            h('button', { 
              className: 'btn-primary', 
              onClick: handleSubmit, 
              disabled: submitting || !allSigned,
              style: { padding: '10px 18px', fontSize: 14 },
            }, submitting ? '저장 중...' : '✅ 서명 완료'),
          ),
        ),
        contract.message ? h('div', { className: 'sign-message-box' }, 
          '💬 ', contract.message
        ) : null,
      ),
    ),
    
    h('div', { className: 'doc-container' },
      h('div', { 
        ref: docRef,
        style: { position: 'relative' } 
      },
        h('div', { 
          className: 'doc-content',
          dangerouslySetInnerHTML: { __html: contract.original_html } 
        }),
        (contract.fields || []).map(f => {
          const type = FIELD_TYPES.find(t => t.id === f.type);
          const value = fieldValues[f.id];
          const filled = value != null && value !== '';
          const useLeft = f.xPercent != null ? (f.xPercent + '%') : f.x;
          const useTop = f.yPercent != null ? (f.yPercent + '%') : f.y;
          return h('div', {
            key: f.id,
            className: 'field-overlay' + (f.type === 'signature' ? ' signature' : '') + (filled ? ' filled' : ''),
            style: { left: useLeft, top: useTop, width: f.width, height: f.height },
            onClick: () => {
              if (f.type === 'signature') {
                setSigningFieldId(f.id);
              } else if (f.type === 'date') {
                setFieldValue(f.id, new Date().toLocaleDateString('ko-KR'));
              } else if (f.type === 'name' || f.type === 'text') {
                const val = prompt(type.label + ' 입력', value || '');
                if (val !== null) setFieldValue(f.id, val);
              }
            },
          },
            f.type === 'signature' && filled 
              ? h('img', { src: value, style: { maxWidth: '100%', maxHeight: '100%', objectFit: 'contain' }, alt: '서명' })
              : (filled ? value : type.icon + ' ' + type.label.split(' ')[1] + ' 클릭')
          );
        }),
      ),
    ),
    
    // 서명 모달
    signingFieldId ? h('div', { className: 'modal-backdrop' },
      h('div', { className: 'modal', style: { maxWidth: 500 } },
        h('div', { className: 'modal-header' },
          h('div', { className: 'modal-title' }, '✍️ 서명'),
          h('button', { className: 'modal-close', onClick: () => setSigningFieldId(null) }, '×'),
        ),
        h('div', { className: 'modal-body' },
          h('div', { style: { fontSize: 12, color: 'var(--text-sub)', marginBottom: 10 } },
            '마우스 또는 손가락으로 서명해주세요',
          ),
          h(SignaturePad, {
            initialData: fieldValues[signingFieldId],
            onSave: (data) => {
              setFieldValue(signingFieldId, data);
              setSigningFieldId(null);
            },
            onCancel: () => setSigningFieldId(null),
          }),
        ),
      ),
    ) : null,
  );
}

// ============ Main App ============
function App() {
  const { user, loading: authLoading, notAllowed, resetNotAllowed } = useAuth();
  const [showLogin, setShowLogin] = useState(false);
  const [view, setView] = useState('list'); // list | new | detail
  const [selectedContract, setSelectedContract] = useState(null);
  
  // URL 파라미터로 수신자 뷰 진입 (인증 무관)
  const signToken = getUrlParam('sign');
  
  if (signToken) {
    return h(Fragment, null,
      h('div', { className: 'app' },
        h('div', { className: 'header' },
          h('div', { className: 'logo' },
            '📝 말계약',
            h('span', { className: 'logo-badge' }, 'SIGN'),
          ),
        ),
        h(SignView, { token: signToken }),
      ),
    );
  }
  
  if (authLoading) return h('div', { style: { padding: 40, textAlign: 'center' } }, '로딩 중...');
  
  return h('div', { className: 'app' },
    h('div', { className: 'header' },
      h('div', { className: 'logo' },
        '📝 말계약',
        h('span', { className: 'logo-badge' }, 'v2 BETA'),
      ),
      h('div', { className: 'header-actions' },
        user ? h(Fragment, null,
          h('span', { style: { fontSize: 12, opacity: 0.9 } }, user.email),
          h('button', { 
            className: 'header-btn', 
            onClick: async () => { await supabase.auth.signOut(); },
          }, '로그아웃'),
        ) : h('button', { 
          className: 'header-btn', onClick: () => setShowLogin(true),
        }, '로그인'),
      ),
    ),
    
    h('div', { className: 'main' },
      notAllowed ? h('div', { className: 'card empty' },
        h('div', { className: 'empty-icon' }, '🚫'),
        h('div', { className: 'empty-title' }, '접근 권한 없음'),
        h('div', { className: 'empty-desc' }, 
          '이 계정은 말계약 대시보드 접근 권한이 없습니다.',
          h('br'),
          '허가된 관리자 계정으로 로그인해주세요.',
        ),
        h('button', { 
          className: 'btn-primary', 
          onClick: () => { resetNotAllowed(); setShowLogin(true); } 
        }, '다시 로그인'),
      )
      : !user ? h('div', { className: 'card empty' },
        h('div', { className: 'empty-icon' }, '🔐'),
        h('div', { className: 'empty-title' }, '관리자 전용'),
        h('div', { className: 'empty-desc' }, 
          '말계약 대시보드는 허가된 관리자만 접근 가능합니다.',
          h('br'),
          h('span', { style: { fontSize: 11 } }, '※ 서명 링크를 받으신 분은 링크를 직접 클릭해주세요.'),
        ),
        h('button', { className: 'btn-primary', onClick: () => setShowLogin(true) }, '🔓 관리자 로그인'),
      )
      : view === 'list' ? h(ContractList, { 
          user,
          onNew: () => setView('new'),
          onView: (c) => { setSelectedContract(c); setView('detail'); },
        })
      : view === 'new' ? h(ContractEditor, { 
          user,
          onDone: () => setView('list'),
        })
      : view === 'detail' && selectedContract ? h(ContractDetail, {
          contract: selectedContract,
          onBack: () => setView('list'),
        })
      : null,
    ),
    
    showLogin ? h(LoginModal, { onClose: () => setShowLogin(false) }) : null,
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
